# What setup.bat (src/installer.py) installs and checks. No registries and no autostart: config.json
# is the one local file, and starting at log on is a manual shortcut (docs/install.md).
[install]
settings = ["config.json"]

[[install.config]]
sample = "config.sample.json"
target = "config.json"

[[install.check]]
name   = "git"
level  = "optional"
blocks = "updates and the restart's build check"
which  = "git"
hint   = "install Git for Windows"

[[install.check]]
name    = "ffmpeg"
level   = "optional"
blocks  = "recording"
command = ["{python}", "-B", "scripts/install_check.py", "ffmpeg"]
hint    = "only recording needs it: put ffmpeg on PATH, or set recording.ffmpeg_path"

[[install.check]]
name    = "Restart helper"
level   = "optional"
blocks  = "tray.bat --restart"
command = ["{python}", "-B", "scripts/install_check.py", "restart-helper"]
hint    = "it comes from fleet-config's install.ps1; without it, quit from the tray menu and run tray.bat"

# setup.bat -MigrateFrom / -InPlace. The probe's port is the top-level `port`: it is a constant in
# the code, so there is no port_config to read.
[install.endpoint]
scheme       = "http"
version_path = "/api/version"

# config.json is the whole of this PC's state: no secret, no certificate, no runtime-data folder.
# A plain start, not --restart: the old copy is already stopped, and --restart needs fleet-config.
[install.migrate]
copy    = ["config.json"]
secrets = []
shared  = []
start   = ["tray.bat"]

# Design-lint verdicts for the settings page (src/overmark/static/), which is one view.
[[design.accepted]]
check  = "nav-contract"
reason = "One page and no tabs: a bottom tab bar with a single tab would break the navigation contract, so the page has no nav"

[[design.accepted]]
check  = "rendered-leg"
reason = "No e2e suite in this repo (CLAUDE.md): the page's hit targets come from the vendored settings-group, switch and modal components unchanged"

