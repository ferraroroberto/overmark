[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored copies are byte-for-byte from project-scaffolding (see .fleet.toml [vendored]); never edited here.
extend-exclude = ["scripts/*_ratchet.py", "scripts/conventions_*.py", "scripts/instruction_*.py",
  "scripts/request_budget_scan.py", "scripts/runtime_write_resolve.py", "scripts/structure_*.py",
  "scripts/run_ratchets.py", "tests/host/_synthetic_host.py", "src/build_info.py",
  "src/installer*.py", "src/ps_script.py", "src/restart_check.py", "src/self_restart.py", "src/request_timing.py",
  "scripts/install_standard_ratchet.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
